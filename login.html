<!DOCTYPE html>
<html lang="en" dir="LEF"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صيدليتنا - تسجيل الدخول</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Cairo', sans-serif;

            background-color: #ffffff; 
            min-height: 100vh;
        }


        .text-success {
            color: #ea580c !important;
        }


        .btn-success {
            background-color: #ea580c !important;
            border-color: #ea580c !important;
            transition: all 0.3s ease;
        }
        .btn-success:hover {
            background-color: #c2410c !important;
            border-color: #c2410c !important;
            transform: translateY(-1px);
        }


        .form-control:focus {
            border-color: #ea580c !important;
            box-shadow: 0 0 0 0.25rem rgba(234, 88, 12, 0.15) !important;
        }


        .card {
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05) !important;
            border: 1px solid rgba(234, 88, 12, 0.1) !important;
        }

        a.text-success:hover {
            color: #c2410c !important;
        }


        .form-check-input:checked {
            background-color: #ea580c !important;
            border-color: #ea580c !important;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card p-4 rounded-4" style="max-width: 450px; width: 100%;">
        <div class="text-center mb-4">
            <i class="bi bi-capsule-solid text-success fs-1"></i> <h2 class="fw-bold text-dark mt-2">مرحباً بك مجدداً</h2>
            <p class="text-muted">سجل دخولك للوصول إلى أدويتك ومنتجات العناية</p>
        </div>

        <form>
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">البريد الإلكتروني أو رقم الهاتف</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" placeholder="example@mail.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">كلمة المرور</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label text-muted fs-7" for="rememberMe">تذكرني</label>
                </div>
                <a href="#" class="text-decoration-none text-success small">نسيت كلمة المرور؟</a>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2 rounded-3 fw-bold fs-5 shadow-sm">تسجيل الدخول</button>
        </form>

        <hr class="text-muted my-4">

        <div class="text-center">
            <p class="text-muted mb-0">ليس لديك حساب؟ <a href="#" class="text-success fw-bold text-decoration-none">إنشاء حساب جديد</a></p>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
